<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momo Break — Settings</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #4a2f2a;
        --muted: #8a6a64;
        --cream: #fff6ef;
        --card: #fffdfb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Nunito, system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 10%, #ffe8dc 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, #ffd9c8 0%, transparent 36%),
          #f7ebe3;
        padding: 32px 20px 48px;
      }
      .wrap {
        max-width: 440px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
        font-weight: 800;
      }
      .sub {
        color: var(--muted);
        font-weight: 600;
        margin: 0 0 20px;
      }
      .card {
        background: var(--card);
        border-radius: 16px;
        padding: 16px 18px;
        border: 1px solid #ffe4d8;
        margin-bottom: 14px;
      }
      .card h2 {
        font-size: 0.95rem;
        margin: 0 0 12px;
        font-weight: 800;
      }
      label {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
        font-size: 0.85rem;
        font-weight: 700;
      }
      select,
      input[type="time"],
      input[type="text"],
      input[type="file"] {
        border: 1px solid #ead2c8;
        border-radius: 10px;
        padding: 8px 10px;
        background: #fff;
        font-family: inherit;
        font-size: 0.9rem;
      }
      .hours {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tiny {
        font-size: 0.75rem;
        color: var(--muted);
        font-weight: 600;
        margin: 0 0 8px;
      }
      .thumb-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .thumb-row img {
        width: 44px;
        height: 44px;
        object-fit: cover;
        border-radius: 10px;
        background: var(--cream);
      }
      .task-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .task-row input {
        flex: 1;
      }
      .task-row button {
        border: 0;
        background: var(--cream);
        color: var(--ink);
        font-weight: 800;
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.8rem;
      }
      .custom-list {
        list-style: none;
        margin: 0 0 12px;
        padding: 0;
      }
      .custom-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: var(--cream);
        border-radius: 10px;
        padding: 8px 10px;
        margin-bottom: 6px;
        font-size: 0.85rem;
        font-weight: 700;
      }
      .custom-list button {
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 1rem;
        line-height: 1;
        padding: 2px 4px;
      }
      .add-row {
        display: flex;
        gap: 8px;
      }
      .add-row input { flex: 1; }
      .add-row button {
        border: 0;
        background: var(--ink);
        color: #fff8f4;
        font-weight: 800;
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
      }
      .saved {
        text-align: center;
        font-size: 0.8rem;
        font-weight: 700;
        color: #3f7a5a;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .saved.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Momo Break</h1>
      <p class="sub">Pop-up settings</p>

      <div class="card">
        <h2>Timing</h2>
        <label>
          Appear after
          <select id="interval">
            <option value="25">25 minutes</option>
            <option value="50">50 minutes</option>
            <option value="90">90 minutes</option>
            <option value="custom">Custom…</option>
          </select>
        </label>
        <label id="custom-interval-wrap" hidden>
          Custom minutes
          <span class="hours">
            <input type="number" id="custom-interval" min="5" max="240" step="1" value="40" />
            <span>min</span>
          </span>
        </label>
        <label>
          Work hours
          <span class="hours">
            <input type="time" id="work-start" value="09:00" />
            to
            <input type="time" id="work-end" value="18:00" />
          </span>
        </label>
      </div>

      <div class="card">
        <h2>Your checklist items</h2>
        <p class="tiny">
          Defaults are always available. Add your own — Momo picks 3–4 per break.
        </p>
        <ul class="custom-list" id="custom-list"></ul>
        <div class="add-row">
          <input type="text" id="custom-input" placeholder="e.g. Stand up and walk" maxlength="60" />
          <button type="button" id="add-task">Add</button>
        </div>
      </div>

      <div class="card">
        <h2>Mascots</h2>
        <p class="tiny">Default is Momo. Upload photos to rotate in.</p>
        <input type="file" id="mascot-upload" accept="image/*" multiple />
        <div class="thumb-row" id="thumbs" style="margin-top: 10px"></div>
      </div>

      <p class="saved" id="saved">Saved</p>
    </div>
    <script src="options.js"></script>
  </body>
</html>
